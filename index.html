<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BondhuCall - Anonymous P2P</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg: #FFDE59;
            --card: #FF914D;
            --white: #FFFFFF;
            --black: #000000;
            --green: #4CAF50;
            --blue: #5271FF;
            --red: #FF3131;
        }

        body {
            font-family: 'Fredoka One', cursive;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-container {
            background: var(--card);
            padding: 30px;
            border-radius: 40px;
            border: 6px solid var(--black);
            box-shadow: 12px 12px 0px var(--black);
            width: 360px;
            text-align: center;
        }

        .status-pill {
            display: inline-block;
            padding: 6px 18px;
            background: var(--white);
            border: 3px solid var(--black);
            border-radius: 50px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .id-display {
            background: var(--white);
            border: 4px solid var(--black);
            padding: 15px;
            border-radius: 20px;
            margin: 15px 0;
            font-size: 20px;
            color: var(--red);
            letter-spacing: 1px;
        }

        input {
            width: 85%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 15px;
            border: 4px solid var(--black);
            font-family: inherit;
            outline: none;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 20px;
            border: 4px solid var(--black);
            box-shadow: 5px 5px 0px var(--black);
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            color: var(--white);
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--black);
        }

        #video-box {
            margin-top: 20px;
            display: none;
        }

        video {
            width: 100%;
            border: 4px solid var(--black);
            border-radius: 20px;
            background: var(--black);
        }

        .label { font-size: 14px; color: var(--black); margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="status-pill" id="status-tag">Connecting... 🟡</div>
    <h1 style="margin: 0; color: white; -webkit-text-stroke: 1.5px black;">BondhuCall</h1>
    
    <div class="label">Your Private ID:</div>
    <div class="id-display" id="my-id-text">GENERATING...</div>
    
    <div class="label" id="location-text">Location: Detecting...</div>

    <hr style="border: 2px solid black; margin: 20px 0;">

    <input type="text" id="friend-id-input" placeholder="Enter Friend's ID">
    <button class="btn" style="background: var(--blue);" onclick="initiateCall()">Call Friend 📞</button>

    <div id="video-box">
        <video id="remote-stream" autoplay playsinline></video>
        <button class="btn" style="background: var(--red);" onclick="location.reload()">End Call ✖</button>
    </div>
</div>

<script>
    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyBxT3Id3erXo5XbcWZ1ZGG-cQ3CbQ66MF4",
        authDomain: "bondhucal.firebaseapp.com",
        databaseURL: "https://bondhucal-default-rtdb.firebaseio.com",
        projectId: "bondhucal",
        storageBucket: "bondhucal.firebasestorage.app",
        messagingSenderId: "588571744660",
        appId: "1:588571744660:web:9cf230c344a887aa799781"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ID Setup & 24h Expiry
    let myID = localStorage.getItem('bondhu_key');
    let lastVisit = localStorage.getItem('last_visit');
    const currentTime = Date.now();

    if (myID && lastVisit && (currentTime - lastVisit > 24 * 60 * 60 * 1000)) {
        myID = null; // Expired
    }

    if (!myID) {
        myID = 'UID-' + Math.random().toString(36).substr(2, 8).toUpperCase();
        localStorage.setItem('bondhu_key', myID);
    }
    localStorage.setItem('last_visit', currentTime);
    document.getElementById('my-id-text').innerText = myID;

    // Location & Online Status
    function startSystem() {
        const userRef = db.ref('users/' + myID);
        
        // Instant Online Update
        userRef.set({ id: myID, status: 'online', country: 'Searching...' });
        userRef.onDisconnect().remove();
        document.getElementById('status-tag').innerText = "Online 🟢";

        // Fetch Country with HTTPS
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                document.getElementById('location-text').innerText = "Location: " + data.country_name;
                userRef.update({ country: data.country_name });
            })
            .catch(() => {
                document.getElementById('location-text').innerText = "Location: Unknown";
            });
    }

    // PeerJS Calling Logic
    const peer = new Peer(myID);

    peer.on('call', call => {
        if(confirm("Incoming Call! Answer?")) {
            navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                call.answer(stream);
                handleStream(call);
            });
        }
    });

    function initiateCall() {
        const targetID = document.getElementById('friend-id-input').value;
        if (!targetID) return alert("Please enter an ID");

        db.ref('users/' + targetID).once('value', snapshot => {
            if (snapshot.exists()) {
                navigator.mediaDevices.getUserMedia({video: true, audio: true}).then(stream => {
                    const call = peer.call(targetID, stream);
                    handleStream(call);
                });
            } else {
                alert("User is Offline or ID is wrong!");
            }
        });
    }

    function handleStream(call) {
        document.getElementById('video-box').style.display = 'block';
        call.on('stream', stream => {
            document.getElementById('remote-stream').srcObject = stream;
        });
    }

    startSystem();
</script>

</body>
</html>
