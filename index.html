<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BondhuCall - Global P2P</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --bg: #FFDE59; --main: #FF914D; --white: #FFFFFF; --black: #000000; --blue: #5271FF; --red: #FF3131; --green: #4CAF50; }
        body { font-family: 'Fredoka One', cursive; background-color: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; }
        .app-card { background: var(--main); padding: 25px; border-radius: 40px; border: 6px solid var(--black); box-shadow: 10px 10px 0px var(--black); text-align: center; margin-bottom: 20px; }
        .status-badge { display: inline-block; padding: 5px 15px; background: var(--white); border: 3px solid var(--black); border-radius: 50px; font-size: 12px; margin-bottom: 10px; }
        .id-box { background: var(--white); border: 4px solid var(--black); padding: 12px; border-radius: 20px; margin: 10px 0; font-size: 20px; color: var(--red); cursor: pointer; }
        input { width: 85%; padding: 12px; margin: 10px 0; border-radius: 15px; border: 4px solid var(--black); font-family: inherit; text-align: center; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 15px; border: 4px solid var(--black); box-shadow: 4px 4px 0px var(--black); cursor: pointer; font-family: inherit; color: white; font-size: 14px; }
        .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--black); }
        .users-panel { background: var(--white); border: 5px solid var(--black); border-radius: 30px; padding: 15px; max-height: 200px; overflow-y: auto; }
        .user-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 2px solid #eee; cursor: pointer; font-size: 13px; }
        #video-zone { margin-top: 20px; display: none; }
        video { width: 100%; border: 5px solid var(--black); border-radius: 20px; background: #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="app-card">
        <div class="status-badge" id="st-tag">CONNECTING... 🟡</div>
        <h1 style="margin:0; color:white; -webkit-text-stroke: 1.2px black;">BONDHUCALL</h1>
        <p style="font-size: 12px; margin: 10px 0 0;">YOUR PRIVATE ID (CLICK TO COPY):</p>
        <div class="id-box" id="my-id-display" onclick="copyID()">LOADING...</div>
        <input type="text" id="target-id" placeholder="Enter Friend's ID">
        <div class="btn-group">
            <button class="btn" style="background: var(--blue);" onclick="startCall(true)">VIDEO 🎥</button>
            <button class="btn" style="background: var(--green);" onclick="startCall(false)">AUDIO 📞</button>
        </div>
        <div id="video-zone">
            <video id="remote-v" autoplay playsinline></video>
            <button class="btn" style="background: var(--red); width: 100%;" onclick="location.reload()">END CALL ✖</button>
        </div>
    </div>
    <div class="users-panel">
        <h3 style="margin-top:0; font-size: 16px; text-align: center;">ACTIVE USERS 🌎</h3>
        <div id="active-list">Searching for peers...</div>
    </div>
</div>

<audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3" loop></audio>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBxT3Id3erXo5XbcWZ1ZGG-cQ3CbQ66MF4",
        authDomain: "bondhucal.firebaseapp.com",
        databaseURL: "https://bondhucal-default-rtdb.firebaseio.com",
        projectId: "bondhucal",
        storageBucket: "bondhucal.firebasestorage.app",
        messagingSenderId: "588571744660",
        appId: "1:588571744660:web:9cf230c344a887aa799781"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ringtone = document.getElementById('ringtone');

    // Request Notification Permission
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    let myID = localStorage.getItem('p_id') || 'BC-' + Math.random().toString(36).substr(2, 7).toUpperCase();
    localStorage.setItem('p_id', myID);
    document.getElementById('my-id-display').innerText = myID;

    const peer = new Peer(myID);
    let myCountry = "Unknown";

    function init() {
        const userRef = db.ref('users/' + myID);
        setInterval(() => {
            userRef.set({ id: myID, country: myCountry, last_seen: Date.now() });
        }, 3000);
        userRef.onDisconnect().remove();
        document.getElementById('st-tag').innerText = "ONLINE 🟢";

        fetch('https://ipapi.co/json/').then(r => r.json()).then(d => {
            myCountry = d.country_name;
        });

        db.ref('users').on('value', snapshot => {
            const listDiv = document.getElementById('active-list');
            listDiv.innerHTML = '';
            snapshot.forEach(child => {
                const user = child.val();
                if(user.id !== myID) {
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `<span>👤 ${user.id}</span><span>📍 ${user.country}</span>`;
                    item.onclick = () => document.getElementById('target-id').value = user.id;
                    listDiv.appendChild(item);
                }
            });
            if(listDiv.innerHTML === '') listDiv.innerText = "No one else is online.";
        });
    }

    function copyID() {
        navigator.clipboard.writeText(myID);
        alert("ID Copied!");
    }

    function showNotification(callerID) {
        if (Notification.permission === "granted") {
            new Notification("Incoming Call", {
                body: "Friend " + callerID + " is calling you!",
                icon: "https://cdn-icons-png.flaticon.com/512/3616/3616215.png"
            });
        }
    }

    // Handle Incoming Call
    peer.on('call', call => {
        ringtone.play(); // Start Ringing
        showNotification(call.peer); // Try Background Notification

        const type = call.options.metadata?.video ? "Video" : "Audio";
        
        setTimeout(() => { // Small delay to let ringtone start
            if(confirm(`Incoming ${type} Call from ${call.peer}! Answer?`)) {
                ringtone.pause();
                ringtone.currentTime = 0;
                navigator.mediaDevices.getUserMedia({video: call.options.metadata?.video, audio: true}).then(stream => {
                    call.answer(stream);
                    handleStream(call);
                });
            } else {
                ringtone.pause();
                ringtone.currentTime = 0;
            }
        }, 500);
    });

    function startCall(withVideo) {
        const tID = document.getElementById('target-id').value.trim();
        if(!tID) return alert("Enter an ID!");

        navigator.mediaDevices.getUserMedia({video: withVideo, audio: true}).then(stream => {
            const call = peer.call(tID, stream, {metadata: {video: withVideo}});
            handleStream(call);
        }).catch(() => alert("Camera/Mic Permission Denied!"));
    }

    function handleStream(call) {
        document.getElementById('video-zone').style.display = 'block';
        call.on('stream', remoteStream => {
            document.getElementById('remote-v').srcObject = remoteStream;
            ringtone.pause(); // Stop ringtone if call is connected
        });
    }

    peer.on('open', init);
</script>
</body>
</html>
